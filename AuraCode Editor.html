<!DOCTYPE html>
<html lang="en">

<head>
    <title>AuraCode — AI Code Editor</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="AuraCode — A browser-based, AI-assisted code editor with Gemini integration, smart code replacement, and a premium spatial UI.">

    <!-- ============================================================= -->
    <!-- INHERITED EXTERNAL DEPENDENCIES (From AuraChat Codex)          -->
    <!-- Markdown parsing, sanitization, syntax highlighting, KaTeX     -->
    <!-- ============================================================= -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked-katex-extension/lib/index.umd.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.9/purify.min.js"></script>

    <!-- Google Font (Inherited from Codex) -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Quicksand:wght@300..700&family=JetBrains+Mono:wght@300;400;500;600&display=swap');
    </style>

    <style>
        /* ============================================================= */
        /*  CORE CSS VARIABLES — Inherited from AuraChat Codex           */
        /*  Exact same spatial/neumorphic design language & Bento grid   */
        /* ============================================================= */
        :root {
            --bg-app: #0f0f13;
            --bg-spatial: rgba(28, 28, 33, 0.65);
            --bg-bento: rgba(40, 40, 48, 0.5);
            --bg-neumorphic: #222228;
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f4f4f5;
            --text-secondary: #a1a1aa;
            --accent-color: #fafafa;
            --active-color: #60a5fa;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
            --success-color: #34d399;

            /* Neumorphism Shadows for Micro-interactions */
            --shadow-raised: 3px 3px 8px rgba(0,0,0,0.5), -3px -3px 8px rgba(255,255,255,0.04);
            --shadow-inset: inset 3px 3px 6px rgba(0,0,0,0.5), inset -3px -3px 6px rgba(255,255,255,0.04);

            /* Spatial Deep Shadows */
            --shadow-spatial: 0 24px 48px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.05);
            --shadow-floating: 0 8px 24px rgba(0,0,0,0.3), 0 0 0 1px rgba(255,255,255,0.05);

            /* Editor-specific variables */
            --editor-bg: #18181b;
            --editor-line-bg: rgba(96, 165, 250, 0.06);
            --gutter-bg: rgba(0,0,0,0.3);
            --gutter-color: #52525b;
            --tab-active: rgba(96, 165, 250, 0.15);
            --resizer-color: rgba(255, 255, 255, 0.06);
            --resizer-hover: var(--active-color);
        }

        /* ============================================================= */
        /*  GLOBAL BODY — Inherited aesthetic with radial gradients       */
        /* ============================================================= */
        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-app);
            background-image: radial-gradient(circle at top right, rgba(96, 165, 250, 0.05), transparent 40%),
                              radial-gradient(circle at bottom left, rgba(168, 85, 247, 0.05), transparent 40%);
            color: var(--text-primary);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            padding: 12px;
            box-sizing: border-box;
            gap: 12px;
            font-size: 0.85rem;
        }

        /* ============================================================= */
        /*  TOP HEADER BAR — Global controls & branding                  */
        /* ============================================================= */
        #app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            background-color: var(--bg-spatial);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-floating);
            flex-shrink: 0;
            min-height: 48px;
            gap: 12px;
        }

        .header-left, .header-right, .header-center {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-center {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        #app-title {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-primary);
            letter-spacing: 0.5px;
        }

        #app-title span {
            background: linear-gradient(135deg, #60a5fa, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Mode Toggle (Gemini/Gemma) — Inherited */
        .switch { position: relative; display: inline-block; width: 48px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--bg-neumorphic); transition: .4s; border-radius: 24px;
            box-shadow: var(--shadow-inset);
        }
        .slider:before {
            position: absolute; content: ""; height: 16px; width: 16px; left: 4px; bottom: 4px;
            background-color: var(--text-secondary); transition: .4s; border-radius: 50%;
            box-shadow: var(--shadow-raised);
        }
        input:checked + .slider:before { background-color: #a855f7; transform: translateX(20px); }
        .mode-label {
            font-size: 0.8rem; font-weight: 600; color: var(--text-secondary);
            transition: color 0.3s; user-select: none;
        }
        .mode-label.active { color: var(--text-primary); }

        /* Header Buttons — Neumorphic */
        .header-btn {
            background: var(--bg-neumorphic); border: none; color: var(--text-secondary);
            cursor: pointer; padding: 8px 14px; border-radius: 12px;
            box-shadow: var(--shadow-raised); transition: all 0.2s ease;
            font-size: 0.8rem; font-weight: 500; font-family: inherit;
            display: flex; align-items: center; gap: 6px;
        }
        .header-btn:active { box-shadow: var(--shadow-inset); color: var(--text-primary); }
        .header-btn:hover { color: var(--text-primary); }

        /* ============================================================= */
        /*  SPLIT-PANE LAYOUT — Editor (Left) + Chat (Right)             */
        /* ============================================================= */
        #split-container {
            flex-grow: 1;
            display: flex;
            gap: 0;
            overflow: hidden;
            min-height: 0;
        }

        /* Left Pane — The Code Editor */
        #editor-pane {
            flex: 1 1 55%;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-spatial);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-spatial);
            overflow: hidden;
            min-width: 300px;
        }

        /* Resizer Handle */
        #pane-resizer {
            width: 8px;
            cursor: col-resize;
            background: var(--resizer-color);
            flex-shrink: 0;
            transition: background 0.2s;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #pane-resizer:hover, #pane-resizer.dragging {
            background: rgba(96, 165, 250, 0.2);
        }
        #pane-resizer::after {
            content: '';
            width: 2px;
            height: 40px;
            background: rgba(255,255,255,0.15);
            border-radius: 2px;
            transition: background 0.2s;
        }
        #pane-resizer:hover::after, #pane-resizer.dragging::after {
            background: var(--active-color);
        }

        /* Right Pane — The AI Chat */
        #chat-pane {
            flex: 1 1 45%;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-spatial);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-spatial);
            overflow: hidden;
            min-width: 300px;
        }

        /* ============================================================= */
        /*  EDITOR TAB BAR                                                */
        /* ============================================================= */
        #editor-tab-bar {
            display: flex;
            align-items: center;
            gap: 2px;
            padding: 6px 12px 0 12px;
            overflow-x: auto;
            flex-shrink: 0;
            border-bottom: 1px solid var(--border-color);
            background: rgba(0,0,0,0.15);
        }

        .editor-tab {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            background: transparent;
            border: 1px solid transparent;
            border-bottom: none;
            border-radius: 10px 10px 0 0;
            color: var(--text-secondary);
            font-size: 0.78rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            font-family: inherit;
            position: relative;
        }
        .editor-tab:hover {
            color: var(--text-primary);
            background: rgba(255,255,255,0.03);
        }
        .editor-tab.active {
            color: var(--text-primary);
            background: var(--tab-active);
            border-color: var(--border-color);
        }
        .editor-tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--active-color);
            border-radius: 2px 2px 0 0;
        }
        .tab-close {
            font-size: 0.9rem;
            color: var(--text-secondary);
            background: none;
            border: none;
            cursor: pointer;
            padding: 0 2px;
            line-height: 1;
            opacity: 0;
            transition: all 0.15s;
        }
        .editor-tab:hover .tab-close { opacity: 0.7; }
        .tab-close:hover { color: var(--danger-color); opacity: 1 !important; }

        .add-tab-btn {
            padding: 6px 10px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .add-tab-btn:hover { color: var(--text-primary); background: rgba(255,255,255,0.04); }

        /* ============================================================= */
        /*  EDITOR TOOLBAR (Line selection, language label)              */
        /* ============================================================= */
        #editor-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 14px;
            border-bottom: 1px solid var(--border-color);
            background: rgba(0,0,0,0.1);
            gap: 8px;
            flex-shrink: 0;
        }

        .editor-toolbar-left, .editor-toolbar-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .editor-toolbar-btn {
            background: var(--bg-neumorphic); border: none; color: var(--text-secondary);
            cursor: pointer; padding: 5px 10px; border-radius: 8px;
            box-shadow: var(--shadow-raised); transition: all 0.2s ease;
            font-size: 0.72rem; font-weight: 500; font-family: inherit;
            display: flex; align-items: center; gap: 4px;
        }
        .editor-toolbar-btn:active { box-shadow: var(--shadow-inset); color: var(--text-primary); }
        .editor-toolbar-btn:hover { color: var(--text-primary); }

        .line-indicator {
            font-size: 0.72rem;
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
            user-select: none;
        }

        .lang-badge {
            font-size: 0.7rem;
            color: var(--active-color);
            background: rgba(96, 165, 250, 0.1);
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ============================================================= */
        /*  CODE EDITOR AREA (textarea + gutter)                         */
        /* ============================================================= */
        #editor-workspace {
            flex-grow: 1;
            display: flex;
            overflow: hidden;
            position: relative;
            background: var(--editor-bg);
        }

        #line-gutter {
            width: 52px;
            padding: 12px 8px 12px 0;
            text-align: right;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.82rem;
            color: var(--gutter-color);
            background: var(--gutter-bg);
            overflow: hidden;
            user-select: none;
            line-height: 1.6;
            flex-shrink: 0;
            border-right: 1px solid var(--border-color);
        }

        .gutter-line {
            height: 1.6em;
            cursor: pointer;
            transition: color 0.1s;
            padding-right: 6px;
        }
        .gutter-line:hover { color: var(--text-primary); }
        .gutter-line.selected {
            color: var(--active-color);
            background: var(--editor-line-bg);
            font-weight: 600;
        }

        #code-editor {
            flex-grow: 1;
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-primary);
            padding: 12px 16px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.82rem;
            line-height: 1.6;
            resize: none;
            outline: none;
            tab-size: 4;
            -moz-tab-size: 4;
            white-space: pre;
            overflow: auto;
            caret-color: var(--active-color);
        }

        #code-editor::placeholder {
            color: #3f3f46;
            font-family: 'Nunito', sans-serif;
            font-style: italic;
        }

        /* ============================================================= */
        /*  EDITOR STATUS BAR                                            */
        /* ============================================================= */
        #editor-status {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 14px;
            font-size: 0.7rem;
            color: var(--text-secondary);
            background: rgba(0,0,0,0.15);
            border-top: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        /* ============================================================= */
        /*  CHAT PANE HEADER                                             */
        /* ============================================================= */
        #chat-header {
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            gap: 8px;
        }

        #chat-header-title {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #chat-header-title::before {
            content: '';
            width: 8px; height: 8px;
            background: var(--active-color);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--active-color);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ============================================================= */
        /*  SETTINGS PANEL (Bento Grid) — Inherited from Codex           */
        /* ============================================================= */
        #settings-panel {
            background: transparent;
            padding: 12px 16px;
            display: none;
            grid-template-columns: 1fr;
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
            max-height: 50vh;
            overflow-y: auto;
        }
        #settings-panel.visible { display: grid; }

        .bento-card {
            background: var(--bg-bento);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 16px;
            box-shadow: var(--shadow-floating);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .settings-input {
            flex: 1; background: rgba(0,0,0,0.2); border: 1px solid var(--border-color);
            color: var(--text-primary); padding: 10px; border-radius: 10px; outline: none;
            transition: border-color 0.2s; font-family: inherit; font-size: 0.8rem;
        }
        .settings-input:focus { border-color: var(--active-color); }

        #system-instruction {
            width: 100%; background: rgba(0,0,0,0.2); border: 1px solid var(--border-color);
            color: var(--text-primary); padding: 12px; border-radius: 12px; resize: vertical;
            min-height: 60px; font-family: inherit; outline: none; box-sizing: border-box;
            transition: border-color 0.2s; font-size: 0.8rem;
        }
        #system-instruction:focus { border-color: var(--active-color); }

        .settings-btn {
            background: var(--bg-neumorphic); border: none; padding: 10px 16px;
            border-radius: 10px; cursor: pointer; font-weight: 500; font-size: 0.8rem;
            box-shadow: var(--shadow-raised); transition: all 0.2s; color: var(--text-primary);
            font-family: inherit;
        }
        .settings-btn.primary { color: var(--active-color); }
        .settings-btn:active { box-shadow: var(--shadow-inset); }

        .settings-label {
            font-size: 0.78rem;
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 2px;
        }

        /* ============================================================= */
        /*  CHAT MESSAGES — Inherited from Codex                         */
        /* ============================================================= */
        #chat-messages {
            flex-grow: 1; overflow-y: auto; padding: 0.5rem 0.8rem; display: flex;
            flex-direction: column; gap: 0.5rem; scroll-behavior: smooth;
        }

        .message {
            max-width: 100%; width: 100%; line-height: 1.5; font-size: 0.8rem;
        }
        .user-message { display: flex; justify-content: flex-end; }

        .user-content {
            background-color: #2c2c35; color: var(--text-primary); padding: 10px 14px;
            border-radius: 16px; border-bottom-right-radius: 4px; max-width: 90%;
            position: relative; box-shadow: var(--shadow-floating); border: 1px solid var(--border-color);
            font-size: 0.8rem; word-break: break-word;
        }

        .retry-msg-btn {
            display: inline-flex; align-items: center; gap: 4px; margin-top: 10px;
            padding: 4px 10px; background: var(--bg-neumorphic); border: none;
            color: #a1a1aa; border-radius: 10px; font-size: 0.72rem; cursor: pointer;
            transition: all 0.2s ease; float: right; clear: both; box-shadow: var(--shadow-raised);
            font-family: inherit;
        }
        .retry-msg-btn:active { box-shadow: var(--shadow-inset); color: var(--text-primary); }

        .bot-message { display: flex; justify-content: flex-start; flex-direction: column; }
        .bot-content { color: #d4d4d8; width: 100%; }

        .error-message {
            background: rgba(239, 68, 68, 0.1); border: 1px solid var(--danger-color);
            color: #fca5a5; padding: 12px; border-radius: 8px; margin-top: 10px; font-size: 0.8rem;
        }

        .bot-content code {
            background-color: rgba(0,0,0,0.3); padding: 3px 6px; border-radius: 6px;
            font-family: 'JetBrains Mono', monospace; color: #f472b6; font-size: 0.85em;
            border: 1px solid var(--border-color);
        }
        .bot-content pre {
            position: relative; background-color: rgba(0,0,0,0.3); padding: 1.2rem;
            border-radius: 12px; overflow-x: auto; margin: 12px 0;
            border: 1px solid var(--border-color);
        }
        .bot-content pre code {
            background: none; border: none; padding: 0; color: inherit;
        }
        .bot-content p { margin-top: 0; }

        .copy-code-btn, .preview-html-btn {
            position: absolute; top: 10px; background-color: var(--bg-neumorphic);
            border: none; color: var(--text-secondary); padding: 4px 10px;
            border-radius: 8px; font-size: 0.72rem; cursor: pointer; opacity: 0;
            transition: all 0.2s ease; box-shadow: var(--shadow-raised); font-family: inherit;
        }
        .copy-code-btn { right: 10px; }
        .preview-html-btn { right: 70px; }
        .bot-content pre:hover .copy-code-btn, .bot-content pre:hover .preview-html-btn { opacity: 1; }
        .copy-code-btn:active, .preview-html-btn:active {
            box-shadow: var(--shadow-inset); color: var(--text-primary);
        }

        .grounding-sources {
            font-size: 0.75rem; color: #a1a1aa; margin-top: 8px; padding-top: 6px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }
        .source-link { color: #60a5fa; text-decoration: none; margin-right: 6px; display: inline-block; }
        .source-link:hover { text-decoration: underline; }

        /* ============================================================= */
        /*  APPROVE EDITS BUTTON (New for Code Editor)                   */
        /* ============================================================= */
        .approve-edits-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 12px;
            padding: 8px 16px;
            background: linear-gradient(135deg, rgba(52, 211, 153, 0.2), rgba(96, 165, 250, 0.2));
            border: 1px solid var(--success-color);
            color: var(--success-color);
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: var(--shadow-raised);
            font-family: inherit;
        }
        .approve-edits-btn:hover {
            background: linear-gradient(135deg, rgba(52, 211, 153, 0.35), rgba(96, 165, 250, 0.35));
            box-shadow: 0 0 20px rgba(52, 211, 153, 0.2);
        }
        .approve-edits-btn:active { box-shadow: var(--shadow-inset); }
        .approve-edits-btn.applied {
            opacity: 0.5;
            cursor: default;
            border-color: var(--text-secondary);
            color: var(--text-secondary);
        }

        .reject-edits-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 12px;
            margin-left: 8px;
            padding: 8px 14px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            border-radius: 12px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-raised);
            font-family: inherit;
        }
        .reject-edits-btn:hover { background: rgba(239, 68, 68, 0.2); }
        .reject-edits-btn:active { box-shadow: var(--shadow-inset); }

        /* ============================================================= */
        /*  CHAT INPUT AREA — Bento-style, Inherited from Codex          */
        /* ============================================================= */
        #chat-input-wrapper {
            padding: 8px;
            flex-shrink: 0;
        }

        .bento-input-module {
            background: var(--bg-bento); border: 1px solid var(--border-color); border-radius: 14px;
            position: relative; display: flex; flex-direction: column; box-shadow: var(--shadow-floating);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); overflow: hidden;
            transition: border-color 0.2s;
        }
        .bento-input-module:focus-within { border-color: rgba(255,255,255,0.2); }

        #user-input {
            width: 100%; background: transparent; border: none; color: white;
            padding: 8px 12px; font-size: 0.82rem; resize: none; min-height: 34px;
            max-height: 140px; outline: none; box-sizing: border-box; font-family: inherit;
        }

        #input-toolbar {
            display: flex; justify-content: space-between; align-items: center; gap: 4px;
            padding: 4px 6px; flex-wrap: wrap;
        }

        .toolbar-left, .toolbar-right { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }

        .bento-pill {
            display: flex; align-items: center; background: var(--bg-neumorphic);
            border: 1px solid var(--border-color); border-radius: 12px; padding: 2px; gap: 2px;
            box-shadow: var(--shadow-raised);
        }

        .icon-btn {
            background: transparent; border: none; cursor: pointer; padding: 5px;
            border-radius: 8px; color: var(--text-secondary); transition: all 0.2s ease;
            display: flex; align-items: center; justify-content: center; font-family: inherit;
        }
        .icon-btn:active { box-shadow: var(--shadow-inset); background: rgba(0,0,0,0.1); color: var(--text-primary); }
        .icon-btn svg { width: 14px; height: 14px; fill: currentColor; }
        .icon-btn.active { color: var(--active-color); box-shadow: var(--shadow-inset); background: rgba(0,0,0,0.1); }

        #send-button { opacity: 0.5; cursor: not-allowed; }
        #send-button.active { opacity: 1; cursor: pointer; color: var(--text-primary); }
        #send-button.abort { color: var(--danger-color); opacity: 1; cursor: pointer; }

        #model-selector, #key-selector {
            background-color: transparent; color: var(--text-secondary); border: none;
            padding: 5px 8px; border-radius: 8px; font-size: 0.72rem; outline: none;
            cursor: pointer; transition: all 0.2s ease; appearance: none; -webkit-appearance: none;
            font-family: inherit;
        }
        #model-selector option, #key-selector option {
            background: var(--bg-neumorphic); color: var(--text-primary);
        }

        /* ============================================================= */
        /*  SCROLLBAR — Inherited                                        */
        /* ============================================================= */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }

        /* ============================================================= */
        /*  GLASSMORPHISM MODAL (PIN Entry) — Inherited from Codex       */
        /* ============================================================= */
        .glass-modal-overlay {
            display: none; position: fixed; z-index: 200; left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            align-items: center; justify-content: center;
        }
        .glass-modal-box {
            background-color: var(--bg-spatial); padding: 30px; border: 1px solid var(--border-color);
            border-radius: 24px; text-align: center; width: 320px; box-shadow: var(--shadow-spatial);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
        }

        /* HTML Preview Modal — Inherited from Codex */
        #html-preview-modal {
            display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%;
            overflow: auto; background-color: rgba(0, 0, 0, 0.5); backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        #html-preview-modal .modal-content {
            background-color: var(--bg-spatial); margin: 5% auto; padding: 20px;
            border: 1px solid var(--border-color); width: 80%; height: 80%; border-radius: 24px;
            display: flex; flex-direction: column; box-shadow: var(--shadow-spatial);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
        }
        #html-preview-modal .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            padding-bottom: 10px; border-bottom: 1px solid var(--border-color);
        }
        #html-preview-modal .modal-close {
            color: var(--text-secondary); font-size: 28px; font-weight: bold; cursor: pointer;
        }
        #html-preview-modal .modal-close:hover { color: white; }
        #html-preview-modal #preview-iframe {
            width: 100%; height: 100%; border: none; margin-top: 15px;
            background-color: white; border-radius: 12px;
        }

        /* ============================================================= */
        /*  SELECTION HIGHLIGHT EFFECT                                   */
        /* ============================================================= */
        .selection-info {
            font-size: 0.72rem;
            color: var(--active-color);
            background: rgba(96, 165, 250, 0.1);
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* ============================================================= */
        /*  DIFF PREVIEW                                                 */
        /* ============================================================= */
        .diff-preview {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px;
            margin-top: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            line-height: 1.5;
            max-height: 200px;
            overflow-y: auto;
        }
        .diff-line-add { color: var(--success-color); }
        .diff-line-del { color: var(--danger-color); text-decoration: line-through; opacity: 0.7; }
        .diff-line-ctx { color: var(--text-secondary); }
        .diff-header { color: var(--active-color); font-weight: 600; margin-bottom: 4px; }

        /* ============================================================= */
        /*  RESPONSIVE                                                   */
        /* ============================================================= */
        @media (max-width: 900px) {
            #split-container { flex-direction: column; }
            #pane-resizer { width: 100%; height: 8px; cursor: row-resize; }
            #pane-resizer::after { width: 40px; height: 2px; }
            #editor-pane, #chat-pane { min-width: unset; min-height: 200px; }
            .header-center { position: static; transform: none; }
        }

        /* ============================================================= */
        /*  MICRO-ANIMATIONS                                             */
        /* ============================================================= */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message { animation: fadeIn 0.25s ease-out; }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .loading-indicator {
            background: linear-gradient(90deg, var(--bg-bento), rgba(96, 165, 250, 0.1), var(--bg-bento));
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 8px;
            padding: 8px 14px;
            color: var(--text-secondary);
            font-size: 0.78rem;
        }

        /* Toast notifications */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--bg-spatial);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 12px 20px;
            color: var(--text-primary);
            font-size: 0.82rem;
            box-shadow: var(--shadow-spatial);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            z-index: 300;
            animation: fadeIn 0.3s ease-out;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .toast.success { border-color: var(--success-color); }
        .toast.error { border-color: var(--danger-color); }
        .toast.warning { border-color: var(--warning-color); }
    </style>
</head>

<body>

    <!-- ============================================================= -->
    <!-- MAIN APPLICATION SCRIPT                                        -->
    <!-- ============================================================= -->
    <script type="module">
        import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

        // ============================================================= //
        //  INITIALIZE MARKED EXTENSIONS (KaTeX for math rendering)      //
        // ============================================================= //
        if (window.markedKatex) {
            marked.use(window.markedKatex({ throwOnError: false, nonStandard: true }));
        }

        // ============================================================= //
        //  HELPERS — Inherited from AuraChat Codex                       //
        // ============================================================= //
        function escapeHTML(str) {
            if (!str) return '';
            return String(str).replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;',
                "'": '&#39;', '"': '&quot;'
            }[tag]));
        }

        /** DOMPurify config — allows KaTeX math tags through sanitizer */
        const domPurifyConfig = {
            ADD_TAGS: ['math', 'menclose', 'merror', 'mfrac', 'mi', 'mlabeledtr', 'mmultiscripts',
                'mn', 'mo', 'mover', 'mpadded', 'mphantom', 'mroot', 'mrow', 'ms', 'mspace',
                'msqrt', 'mstyle', 'msub', 'msubsup', 'msup', 'mtable', 'mtd', 'mtext', 'mtr',
                'munder', 'munderover', 'semantics', 'annotation', 'annotation-xml'],
            ADD_ATTR: ['target', 'class', 'style', 'display', 'xmlns']
        };

        /** Show a toast notification */
        function showToast(msg, type = 'success', duration = 2500) {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            let icon = '✅';
            if (type === 'error') icon = '❌';
            else if (type === 'warning') icon = '⚠️';
            toast.innerHTML = `${icon} ${escapeHTML(msg)}`;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(10px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }

        // ============================================================= //
        //  MODEL DEFINITIONS — Inherited from AuraChat Codex             //
        // ============================================================= //
        const GEMINI_MODELS = [
            { value: "gemini-3.1-flash-lite-preview", label: "Flash Lite 3.1" },
            { value: "gemini-2.5-flash-lite", label: "Flash Lite 2.5" },
            { value: "gemini-2.5-flash", label: "Flash 2.5" },
            { value: "gemini-2.5-pro", label: "Pro 2.5" },
            { value: "gemma-4-26b-a4b-it", label: "Gemma 4 26B A4B IT" }
        ];

        const GEMMA_MODELS = [
            { value: "gemma-3-1b-it", label: "Gemma 3 1B IT" },
            { value: "gemma-3-4b-it", label: "Gemma 3 4B IT" },
            { value: "gemma-3-12b-it", label: "Gemma 3 12B IT" },
            { value: "gemma-3-27b-it", label: "Gemma 3 27B IT" },
            { value: "gemma-3n-e2b-it", label: "Gemma 3N E2B IT" },
            { value: "gemma-3n-e4b-it", label: "Gemma 3N E4B IT" }
        ];

        // ============================================================= //
        //  LOCALSTORAGE KEY MANAGEMENT — Versioned prefixes              //
        // ============================================================= //
        const LS_PREFIX = 'auracode_v1_';
        const LS_KEYS = {
            model: LS_PREFIX + 'model',
            isGemma: LS_PREFIX + 'is_gemma',
            systemInstruction: LS_PREFIX + 'system_instruction',
            useUrlContext: LS_PREFIX + 'use_url_context',
            useCodeExecution: LS_PREFIX + 'use_code_execution',
            useGoogleSearch: LS_PREFIX + 'use_google_search',
            thinkingMode: LS_PREFIX + 'thinking_mode',
            encryptedKeys: LS_PREFIX + 'encrypted_keys',
            resizerPercent: LS_PREFIX + 'resizer_percent',
        };

        // ============================================================= //
        //  AES-GCM 256-BIT CRYPTO                                        //
        // ============================================================= //
        let decryptedKeys = { key1: "", key2: "" };
        let activePin = null;
        const cryptoParams = { name: "AES-GCM", length: 256 };

        // --- Auto-lock and lockout state ---
        const AUTO_LOCK_MS = 5 * 60 * 1000; // 5 minutes
        let _idleTimer = null;
        const LOCKOUT_LS_KEY = LS_PREFIX + 'lockout';
        const MAX_FAILED_ATTEMPTS = 5;

        /** Get lockout state from localStorage */
        function getLockoutState() {
            try {
                const raw = localStorage.getItem(LOCKOUT_LS_KEY);
                if (!raw) return { attempts: 0, lockedUntil: 0 };
                return JSON.parse(raw);
            } catch { return { attempts: 0, lockedUntil: 0 }; }
        }

        /** Save lockout state to localStorage */
        function setLockoutState(state) {
            localStorage.setItem(LOCKOUT_LS_KEY, JSON.stringify(state));
        }

        /** Record a failed attempt and return the lockout message if locked out */
        function recordFailedAttempt() {
            const state = getLockoutState();
            state.attempts++;
            if (state.attempts >= MAX_FAILED_ATTEMPTS) {
                // Exponential backoff: 30s * 2^(excess attempts)
                const excess = state.attempts - MAX_FAILED_ATTEMPTS;
                const lockoutSec = 30 * Math.pow(2, Math.min(excess, 6)); // max ~32 min
                state.lockedUntil = Date.now() + lockoutSec * 1000;
                setLockoutState(state);
                return `Too many attempts. Locked for ${lockoutSec}s.`;
            }
            setLockoutState(state);
            return null;
        }

        /** Check if currently locked out. Returns remaining seconds or 0. */
        function checkLockout() {
            const state = getLockoutState();
            if (state.lockedUntil && Date.now() < state.lockedUntil) {
                return Math.ceil((state.lockedUntil - Date.now()) / 1000);
            }
            return 0;
        }

        /** Clear lockout on successful unlock */
        function clearLockout() {
            localStorage.removeItem(LOCKOUT_LS_KEY);
        }

        /** Lock the app — wipe keys from memory, show PIN modal */
        function lockApp() {
            decryptedKeys = { key1: "", key2: "" };
            activePin = null;
            genAI = null;
            model = null;
            chat = null;
            els.apiKey1Input.value = '';
            els.apiKey2Input.value = '';
            els.lockBtn.style.display = 'none';
            clearTimeout(_idleTimer);

            // Only show modal if there are encrypted keys to unlock
            if (localStorage.getItem(LS_KEYS.encryptedKeys)) {
                els.pinModal.style.display = 'flex';
                els.startupPin.value = '';
                els.startupPin.focus();
                els.startupCryptoMsg.innerText = '';
            }
            showToast('API keys locked', 'warning');
        }

        /** Reset the idle timer — called on user interaction */
        function resetIdleTimer() {
            clearTimeout(_idleTimer);
            // Only set the timer if keys are currently unlocked
            if (decryptedKeys.key1 || decryptedKeys.key2) {
                _idleTimer = setTimeout(() => lockApp(), AUTO_LOCK_MS);
            }
        }

        /** Start tracking user activity for auto-lock */
        function startIdleTracking() {
            const events = ['mousedown', 'keydown', 'touchstart', 'scroll'];
            events.forEach(evt => document.addEventListener(evt, resetIdleTimer, { passive: true }));
            resetIdleTimer();

        /** Validate passphrase (min 4 characters, alphanumeric + symbols allowed) */
        function validatePassphrase(passphrase) {
            if (!passphrase || passphrase.length < 4) {
                return 'Passphrase must be at least 4 characters.';
            }
            return null; // Valid
        }

        /** Derive a 256-bit AES-GCM key from a passphrase using PBKDF2 */
        async function getCryptoKey(pin, salt) {
            const enc = new TextEncoder();
            const keyMaterial = await crypto.subtle.importKey(
                "raw", enc.encode(pin), { name: "PBKDF2" }, false, ["deriveKey"]
            );
            return await crypto.subtle.deriveKey(
                { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
                keyMaterial, cryptoParams, false, ["encrypt", "decrypt"]
            );
        }

        /** Encrypt an object with AES-GCM using a passphrase */
        async function encryptData(pin, dataObj) {
            const salt = crypto.getRandomValues(new Uint8Array(16));
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const key = await getCryptoKey(pin, salt);
            const enc = new TextEncoder();
            const encrypted = await crypto.subtle.encrypt(
                { name: "AES-GCM", iv: iv }, key, enc.encode(JSON.stringify(dataObj))
            );
            return {
                salt: Array.from(salt),
                iv: Array.from(iv),
                data: Array.from(new Uint8Array(encrypted))
            };
        }

        /** Decrypt AES-GCM encrypted data using a passphrase. Returns null on failure. */
        async function decryptData(pin, encryptedObj) {
            try {
                const salt = new Uint8Array(encryptedObj.salt);
                const iv = new Uint8Array(encryptedObj.iv);
                const data = new Uint8Array(encryptedObj.data);
                const key = await getCryptoKey(pin, salt);
                const decrypted = await crypto.subtle.decrypt(
                    { name: "AES-GCM", iv: iv }, key, data
                );
                return JSON.parse(new TextDecoder().decode(decrypted));
            } catch (e) {
                return null;
            }
        }

        //  INDEXEDDB PERSISTENCE — Debounced auto-save for tabs + chat   //
        // ============================================================= //
        const IDB_NAME = 'auracode_editor_db';
        const IDB_VERSION = 2;
        const IDB_STORE = 'file_tabs';
        const IDB_CHAT_STORE = 'chat_history';
        const IDB_EDITS_STORE = 'edit_sets';
        let _idb = null;
        let _autoSaveTimer = null;

        /** Open (or create) the IndexedDB database */
        function openIDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(IDB_NAME, IDB_VERSION);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(IDB_STORE)) {
                        db.createObjectStore(IDB_STORE, { keyPath: 'id' });
                    }
                    if (!db.objectStoreNames.contains(IDB_CHAT_STORE)) {
                        db.createObjectStore(IDB_CHAT_STORE, { keyPath: 'idx' });
                    }
                    if (!db.objectStoreNames.contains(IDB_EDITS_STORE)) {
                        db.createObjectStore(IDB_EDITS_STORE, { keyPath: 'editId' });
                    }
                };
                req.onsuccess = (e) => {
                    _idb = e.target.result;
                    resolve(_idb);
                };
                req.onerror = (e) => {
                    console.warn('IndexedDB open error:', e);
                    reject(e);
                };
            });
        }

        /** Persist all tabs + activeTabId to IndexedDB */
        async function persistTabs() {
            try {
                if (!_idb) await openIDB();
                const tx = _idb.transaction(IDB_STORE, 'readwrite');
                const store = tx.objectStore(IDB_STORE);
                // Clear then write all — simple and correct
                store.clear();
                // Save a metadata record alongside tab records
                store.put({ id: '__meta__', activeTabId, tabOrder: fileTabs.map(t => t.id) });
                for (const tab of fileTabs) {
                    store.put({ id: tab.id, name: tab.name, language: tab.language, content: tab.content, cursorPos: tab.cursorPos });
                }
                await new Promise((resolve, reject) => { tx.oncomplete = resolve; tx.onerror = reject; });
            } catch (e) {
                console.warn('IndexedDB persist error:', e);
            }
        }

        /** Restore tabs from IndexedDB. Returns true if tabs were restored. */
        async function restoreTabs() {
            try {
                if (!_idb) await openIDB();
                const tx = _idb.transaction(IDB_STORE, 'readonly');
                const store = tx.objectStore(IDB_STORE);
                const allRecords = await new Promise((resolve, reject) => {
                    const req = store.getAll();
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = reject;
                });
                if (!allRecords || allRecords.length <= 1) return false; // Only __meta__ or empty
                const meta = allRecords.find(r => r.id === '__meta__');
                const tabRecords = allRecords.filter(r => r.id !== '__meta__');
                if (tabRecords.length === 0) return false;

                // Restore in saved order if possible
                const ordered = meta?.tabOrder
                    ? meta.tabOrder.map(id => tabRecords.find(r => r.id === id)).filter(Boolean)
                    : tabRecords;

                for (const rec of ordered) {
                    fileTabs.push({ id: rec.id, name: rec.name, language: rec.language, content: rec.content, cursorPos: rec.cursorPos || 0, dirty: false });
                }
                const restoredActiveId = meta?.activeTabId && fileTabs.find(t => t.id === meta.activeTabId)
                    ? meta.activeTabId
                    : fileTabs[0].id;
                activateTab(restoredActiveId);
                renderTabs();
                return true;
            } catch (e) {
                console.warn('IndexedDB restore error:', e);
                return false;
            }
        }

        // ============================================================= //
        const UNDO_STACK_LIMIT = 50;
        const undoStacks = new Map(); // tabId -> [{ content, cursorPos }]

        /** Push a snapshot onto the undo stack for the given tab */
        function pushUndo(tabId, content, cursorPos) {
            if (!undoStacks.has(tabId)) undoStacks.set(tabId, []);
            const stack = undoStacks.get(tabId);
            stack.push({ content, cursorPos });
            if (stack.length > UNDO_STACK_LIMIT) stack.shift();
        }

        /** Pop the last undo snapshot for the active tab. Returns null if empty. */
        function popUndo(tabId) {
            const stack = undoStacks.get(tabId);
            if (!stack || stack.length === 0) return null;
            return stack.pop();
        }

        /** Create a new file tab */
        function createTab(name = 'untitled.js', content = '') {
            const id = 'tab_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7);
            const tab = { id, name, language: detectLanguage(name), content, cursorPos: 0, dirty: false };
            fileTabs.push(tab);
            activateTab(id);
            renderTabs();
            scheduleAutoSave();
            return tab;
        }

        /** Switch to a tab by ID */
        function activateTab(id) {
            if (activeTabId === id) return;

            // Save current tab state before switching
            if (activeTabId) {
                const current = fileTabs.find(t => t.id === activeTabId);
                if (current) {
                    current.content = els.codeEditor.value;
                    current.cursorPos = els.codeEditor.selectionStart;
                }
            }

            activeTabId = id;
            const tab = fileTabs.find(t => t.id === id);
            if (tab) {
                els.codeEditor.value = tab.content;
                els.langBadge.textContent = tab.language;
                // Clamp cursor position to prevent setSelectionRange from throwing
                const clampedPos = Math.min(tab.cursorPos, els.codeEditor.value.length);
                els.codeEditor.setSelectionRange(clampedPos, clampedPos);
                els.codeEditor.focus();
                updateLineGutter();
                updateCursorInfo();
            }
            renderTabs();
        }

        /** Close a tab — prompts if tab has unsaved changes */
        function closeTab(id) {
            const idx = fileTabs.findIndex(t => t.id === id);
            if (idx === -1) return;

            const tab = fileTabs[idx];
            // Warn if the tab has unsaved (dirty) content
            if (tab.dirty) {
                if (!confirm(`"${tab.name}" has unsaved changes. Close anyway?`)) return;
            }

            fileTabs.splice(idx, 1);

            if (fileTabs.length === 0) {
                createTab();
            } else if (activeTabId === id) {
                const newIdx = Math.min(idx, fileTabs.length - 1);
                activateTab(fileTabs[newIdx].id);
            }
            renderTabs();
            scheduleAutoSave();
        }

        /** Render all tabs in the tab bar */
        function renderTabs() {
            // Remove existing tab buttons (keep the + button and any active rename inputs)
            els.tabBar.querySelectorAll('button.editor-tab').forEach(t => t.remove());

            fileTabs.forEach(tab => {
                const tabEl = document.createElement('button');
                tabEl.className = `editor-tab ${tab.id === activeTabId ? 'active' : ''}`;
                tabEl.innerHTML = `
                    <span>${escapeHTML(tab.name)}</span>
                    <span class="tab-close" data-tab-id="${tab.id}" title="Close">×</span>
                `;
                tabEl.addEventListener('click', (e) => {
                    if (e.target.classList.contains('tab-close')) {
                        closeTab(e.target.dataset.tabId);
                    } else {
                        activateTab(tab.id);
                    }
                });
                
                tabEl.addEventListener('dblclick', (e) => {
                    if (e.target.classList.contains('tab-close')) return;
                    const span = tabEl.querySelector('span');
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.value = tab.name;
                    input.style.background = 'transparent';
                    input.style.color = 'var(--text-primary)';
                    input.style.border = 'none';
                    input.style.outline = 'none';
                    input.style.fontFamily = 'inherit';
                    input.style.fontSize = 'inherit';
                    input.style.width = Math.max(50, span.offsetWidth) + 'px';
                    
                    const handleRename = () => {
                        const newName = input.value.trim();
                        if (newName && newName !== tab.name) {
                            tab.name = newName;
                            tab.language = detectLanguage(newName);
                            if (tab.id === activeTabId) els.langBadge.textContent = tab.language;
                        }
                        renderTabs();
                    };
                    
                    input.addEventListener('blur', handleRename);
                    input.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') handleRename();
                        if (e.key === 'Escape') {
                            input.value = tab.name;
                            handleRename();
                        }
                    });
                    
                    tabEl.replaceChild(input, span);
                    input.focus();
                    input.select();
                });
                
                els.tabBar.insertBefore(tabEl, els.addTabBtn);
            });
        }

            const text = els.codeEditor.value;
            const pos = els.codeEditor.selectionStart;
            const lines = text.substring(0, pos).split('\n');
            const ln = lines.length;
            const col = lines[lines.length - 1].length + 1;
            els.lineIndicator.textContent = `Ln ${ln}, Col ${col}`;

            // Update selection info
            const selStart = els.codeEditor.selectionStart;
            const selEnd = els.codeEditor.selectionEnd;
            if (selStart !== selEnd) {
                const startLine = text.substring(0, selStart).split('\n').length;
                const endLine = text.substring(0, selEnd).split('\n').length;
                els.selectionInfo.style.display = 'flex';
                els.selectionInfo.textContent = `Lines ${startLine}-${endLine} selected`;
            } else {
                els.selectionInfo.style.display = 'none';

            const totalLines = text.split('\n').length;
            els.statusLeft.textContent = `${totalLines} lines`;

        /** Get selected line range from the textarea */
        function getSelectedLineRange() {
            const text = els.codeEditor.value;
            const selStart = els.codeEditor.selectionStart;
            const selEnd = els.codeEditor.selectionEnd;

            if (selStart === selEnd) return null;

            const startLine = text.substring(0, selStart).split('\n').length;
            const endLine = text.substring(0, selEnd).split('\n').length;
            const lines = text.split('\n');
            const selectedLines = lines.slice(startLine - 1, endLine);

            return { startLine, endLine, lines: selectedLines, text: selectedLines.join('\n') };
        }

        // ============================================================= //
        //  RESIZABLE SPLIT PANE                                         //
        // ============================================================= //
        function setupResizer() {
            let isResizing = false;

            const startResize = () => {
                isResizing = true;
                els.resizer.classList.add('dragging');
                const isMobile = window.innerWidth <= 900;
                document.body.style.cursor = isMobile ? 'row-resize' : 'col-resize';
                document.body.style.userSelect = 'none';
            };

            els.resizer.addEventListener('mousedown', (e) => {
                startResize();
                e.preventDefault();
            });
            
            els.resizer.addEventListener('touchstart', (e) => {
                startResize();
            }, { passive: true });

            const doResize = (clientX, clientY) => {
                if (!isResizing) return;
                const containerRect = els.splitContainer.getBoundingClientRect();
                const isMobile = window.innerWidth <= 900;
                const resizerSize = 8;
                
                let percent;
                if (isMobile) {
                    percent = ((clientY - containerRect.top) / containerRect.height) * 100;
                } else {
                    percent = ((clientX - containerRect.left) / containerRect.width) * 100;
                }
                
                if (percent >= 20 && percent <= 80) {
                    els.editorPane.style.flex = `0 0 calc(${percent}% - ${resizerSize / 2}px)`;
                    els.chatPane.style.flex = `0 0 calc(${100 - percent}% - ${resizerSize / 2}px)`;
                }
            };

            document.addEventListener('mousemove', (e) => doResize(e.clientX, e.clientY));
            document.addEventListener('touchmove', (e) => {
                if (isResizing) doResize(e.touches[0].clientX, e.touches[0].clientY);
            }, { passive: true });

            const stopResize = () => {
                if (isResizing) {
                    isResizing = false;
                    els.resizer.classList.remove('dragging');
                    document.body.style.cursor = '';
                    document.body.style.userSelect = '';
                    // Persist the resizer position
                    const containerRect = els.splitContainer.getBoundingClientRect();
                    const isMobile = window.innerWidth <= 900;
                    const editorRect = els.editorPane.getBoundingClientRect();
                    const pct = isMobile
                        ? ((editorRect.height / containerRect.height) * 100).toFixed(1)
                        : ((editorRect.width / containerRect.width) * 100).toFixed(1);
                    localStorage.setItem(LS_KEYS.resizerPercent, pct);
                }
            };

            document.addEventListener('mouseup', stopResize);
            document.addEventListener('touchend', stopResize);

            // Restore persisted resizer position on startup
            const savedPercent = parseFloat(localStorage.getItem(LS_KEYS.resizerPercent));
            if (savedPercent && savedPercent >= 20 && savedPercent <= 80 && window.innerWidth > 900) {
                const resizerSize = 8;
                els.editorPane.style.flex = `0 0 calc(${savedPercent}% - ${resizerSize / 2}px)`;
                els.chatPane.style.flex = `0 0 calc(${100 - savedPercent}% - ${resizerSize / 2}px)`;
            }
        }

                const fullSysInstr = CODE_EDIT_SYSTEM_INSTRUCTION +
                    (userSysInstr ? `\n\n## Additional User Instructions:\n${userSysInstr}` : '');

                // Build tools array based on toggle states
                const tools = [];
                const isGemma = els.modeToggle.checked;

                if (!isGemma && els.googleSearchBtn.classList.contains('active')) {
                    tools.push({ googleSearch: {} });
                }
                if (els.urlToggleBtn.classList.contains('active')) {
                    tools.push({ urlContext: {} });
                }
                if (els.codeExecBtn.classList.contains('active')) {
                    tools.push({ codeExecution: {} });
                }

                // Build generationConfig for thinking mode
                let generationConfig = undefined;
                if (sessionConfig.thinkingMode !== 'none') {
                    generationConfig = {
                        thinkingConfig: {
                            includeThoughts: false,
                            thinkingBudget: sessionConfig.thinkingMode === 'low' ? 512 : 24000
                        }
                    };
                }

                model = genAI.getGenerativeModel({
                    model: els.modelSel.value,
                    systemInstruction: (!isGemma && fullSysInstr)
                        ? { parts: [{ text: fullSysInstr }] }
                        : undefined,
                    tools: tools.length > 0 ? tools : undefined,
                    generationConfig: generationConfig
                });

                // Rebuild chat history for API
                const apiHistory = chatHistory
                    .filter(m => m.text && !m.error)
                    .map(m => ({
                        role: m.role === 'user' ? 'user' : 'model',
                        parts: [{ text: m.text }]
                    }));

                chat = model.startChat({ history: apiHistory });

            } catch (e) {
                console.error("Init Chat Error:", e);
            }
        }

        // ============================================================= //
        //  THE SMART REPLACEMENT LOGIC — Bottom-to-Top Edits            //
        //  This is the CORE new logic for the code editor.              //
        //                                                                //
        //  It parses the AI's JSON edit payload and applies edits        //
        //  sorted in DESCENDING order by start_line to prevent           //
        //  line number offset corruption.                                //
        // ============================================================= //

        /**
         * Parse the AI's response text to extract JSON edit blocks.
         * Looks for ```json:edits ... ``` markers in the response.
         * @param {string} responseText - The full AI response text
         * @returns {Array|null} Array of edit objects, or null if none found
         */
        function parseEditsFromResponse(responseText) {
            // Match ```json:edits ... ``` blocks
            const editBlockRegex = /```json:edits\s*\n([\s\S]*?)```/g;
            let match;
            let allEdits = [];

            while ((match = editBlockRegex.exec(responseText)) !== null) {
                try {
                    const parsed = JSON.parse(match[1].trim());
                    if (Array.isArray(parsed)) {
                        allEdits = allEdits.concat(parsed);
                    }
                } catch (e) {
                    console.warn("Failed to parse edit block:", e, match[1]);
                }
            }

            // Validate each edit — reject structurally invalid ones early
            const validEdits = allEdits.filter(edit => {
                if (typeof edit.start_line !== 'number' || typeof edit.end_line !== 'number') return false;
                if (!['replace', 'insert', 'delete'].includes(edit.type)) return false;
                if (edit.start_line <= 0) return false;
                if (edit.end_line < edit.start_line) {
                    console.warn(`Edit rejected in parse: end_line (${edit.end_line}) < start_line (${edit.start_line})`);
                    return false;
                }
                return true;
            });

            return validEdits.length > 0 ? validEdits : null;
        }

        /**
         * APPLY EDITS — The Bottom-to-Top Algorithm
         *
         * CRITICALLY sorts edits by start_line in DESCENDING order before applying.
         * This ensures that modifications to lines lower in the file do NOT
         * invalidate line numbers for edits higher in the file.
         *
         * @param {string} code - The original code content
         * @param {Array} edits - Array of edit objects from the AI
         * @returns {string} The modified code after all edits applied
         */
        function applyEditsBottomToTop(code, edits) {
            const lines = code.split('\n');
            const lineCount = lines.length;

            // --- Validation pass: clamp bounds and reject invalid edits ---
            const validEdits = [];
            for (const edit of edits) {
                // Clamp to [1, lineCount]
                const sl = Math.max(1, Math.min(edit.start_line, lineCount));
                const el = Math.max(1, Math.min(edit.end_line, lineCount));
                if (el < sl) {
                    showToast(`Edit rejected: end_line (${edit.end_line}) < start_line (${edit.start_line})`, 'error', 4000);
                    continue;
                }
                validEdits.push({ ...edit, start_line: sl, end_line: el });
            }

            // --- Overlap detection via interval sweep ---
            const byStart = [...validEdits].sort((a, b) => a.start_line - b.start_line);
            for (let i = 1; i < byStart.length; i++) {
                if (byStart[i].start_line <= byStart[i - 1].end_line) {
                    showToast('Overlapping edits detected — aborting to prevent corruption.', 'error', 5000);
                    return code; // Return code unchanged
                }
            }

            // *** THE KEY INSIGHT: Sort by start_line DESCENDING ***
            // This way we modify lines from the bottom of the file upward,
            // so inserting/deleting lines below doesn't shift indices above.
            const sortedEdits = [...validEdits].sort((a, b) => b.start_line - a.start_line);

            for (const edit of sortedEdits) {
                const startIdx = edit.start_line - 1; // Convert to 0-indexed
                const endIdx = edit.end_line - 1;

                switch (edit.type) {
                    case 'replace': {
                        // Replace lines [startIdx..endIdx] with new content
                        const newLines = edit.lines_content.split('\n');
                        lines.splice(startIdx, endIdx - startIdx + 1, ...newLines);
                        break;
                    }
                    case 'insert': {
                        // Insert new lines AFTER startIdx
                        const newLines = edit.lines_content.split('\n');
                        lines.splice(startIdx + 1, 0, ...newLines);
                        break;
                    }
                    case 'delete': {
                        // Delete lines [startIdx..endIdx]
                        lines.splice(startIdx, endIdx - startIdx + 1);
                        break;
                    }
                }
            }

            return lines.join('\n');
        }

        /**
         * Generate a diff preview for the user before they approve edits.
         * Renders edits top-to-bottom (ascending by start_line) for natural reading order,
         * with 1 context line above and below each edit hunk.
         * @param {Array} edits - The edit operations
         * @param {string} code - The original code
         * @returns {string} HTML string for the diff preview
         */
        function generateDiffPreview(edits, code) {
            const lines = code.split('\n');
            // Sort ascending for top-to-bottom reading order
            const sortedEdits = [...edits].sort((a, b) => a.start_line - b.start_line);
            let html = '<div class="diff-preview">';
            html += `<div class="diff-header">📝 ${edits.length} edit(s) proposed</div>`;

            for (const edit of sortedEdits) {
                html += `<div style="margin: 6px 0; padding-top: 4px; border-top: 1px solid var(--border-color);">`;
                html += `<div class="diff-header" style="font-size: 0.7rem;">`;

                if (edit.type === 'replace') {
                    html += `Replace L${edit.start_line}–L${edit.end_line}`;
                } else if (edit.type === 'insert') {
                    html += `Insert after L${edit.start_line}`;
                } else if (edit.type === 'delete') {
                    html += `Delete L${edit.start_line}–L${edit.end_line}`;
                }
                html += `</div>`;

                // Context line above the edit
                const ctxAbove = edit.start_line - 2; // 0-indexed line above start
                if (ctxAbove >= 0 && ctxAbove < lines.length) {
                    html += `<div class="diff-line-ctx">&nbsp; ${escapeHTML(lines[ctxAbove])}</div>`;
                }

                // Show old lines (for replace/delete)
                if (edit.type === 'replace' || edit.type === 'delete') {
                    for (let i = edit.start_line - 1; i <= Math.min(edit.end_line - 1, lines.length - 1); i++) {
                        html += `<div class="diff-line-del">- ${escapeHTML(lines[i])}</div>`;
                    }
                }

                // Show new lines (for replace/insert)
                if ((edit.type === 'replace' || edit.type === 'insert') && edit.lines_content) {
                    const newLines = edit.lines_content.split('\n');
                    for (const nl of newLines) {
                        html += `<div class="diff-line-add">+ ${escapeHTML(nl)}</div>`;
                    }
                }

                // Context line below the edit
                const ctxBelow = edit.end_line; // 0-indexed line after end
                if (ctxBelow >= 0 && ctxBelow < lines.length) {
                    html += `<div class="diff-line-ctx">&nbsp; ${escapeHTML(lines[ctxBelow])}</div>`;
                }

                html += `</div>`;
            }

            html += '</div>';
            return html;
        }

        /** Render retry button on last user message */
        function renderRetryButton() {
            document.querySelectorAll('.retry-msg-btn').forEach(btn => btn.remove());
            const userMessages = document.querySelectorAll('.user-message');
            if (userMessages.length === 0) return;
            const lastUserMsg = userMessages[userMessages.length - 1];
            const btn = document.createElement('button');
            btn.className = 'retry-msg-btn';
            btn.innerHTML = '↻ Retry';

            if (content) content.appendChild(btn);

        /** Retry the last user message */
        function retryLastMessage() {
            if (chatHistory.length === 0) return;

            const lastMsg = chatHistory[chatHistory.length - 1];
            let userMsgToRetry;

            if (lastMsg.role === 'model') {
                chatHistory.pop();
                userMsgToRetry = chatHistory.pop();
                if (els.chatMsgs.lastElementChild) els.chatMsgs.lastElementChild.remove();
                if (els.chatMsgs.lastElementChild) els.chatMsgs.lastElementChild.remove();
            } else {
                userMsgToRetry = chatHistory.pop();
                if (els.chatMsgs.lastElementChild) els.chatMsgs.lastElementChild.remove();
            }

            if (!userMsgToRetry) return;
            els.userInput.value = userMsgToRetry.text;
            checkInputState();
            sendMessage();
        }

        /** Extract citations/grounding sources — Inherited from Codex */
        function getCitations(response) {
            const chunks = response.candidates?.[0]?.groundingMetadata?.groundingChunks;
            const webChunks = chunks?.filter(c => c.web);
            if (!webChunks?.length) return '';
            return `<div class="grounding-sources">Sources: ${webChunks.map((c, i) => {
                if (!c.web?.uri) return '';
                let uri = c.web.uri;
                try {
                    const urlObj = new URL(uri);
                    if (['javascript:', 'data:', 'vbscript:'].includes(urlObj.protocol)) uri = '#';
                } catch (e) { uri = '#'; }
                return `<a href="${escapeHTML(uri)}" target="_blank" class="source-link">[${i + 1}] ${escapeHTML(c.web.title || 'Source')}</a>`;
            }).join('')}</div>`;
        }

        function formatError(err) {
            let msg = err.message;
            let title = "Error";
            if (msg.includes("429")) { title = "Quota Exceeded"; msg = "Too many requests."; }
            else if (msg.includes("401") || msg.includes("API key")) { title = "Auth Error"; msg = "Invalid API Key."; }
            else if (msg.includes("SAFETY")) { title = "Safety Block"; msg = "Blocked by safety settings."; }
            return `<div class="error-message"><strong>${title}</strong><br>${escapeHTML(msg)}</div>`;
        }

        /**
         * Format code with line numbers for sending to the AI.
         * Raw code wrapped in markdown blocks (not JSON) to save tokens.
         */
        function formatCodeForAI(code, startLine = 1, fileName = '') {
            const lines = code.split('\n');
            const numbered = lines.map((line, i) => `${startLine + i}: ${line}`).join('\n');
            const lang = fileName ? fileName.split('.').pop() : '';
            return `\`\`\`${lang}\n${numbered}\n\`\`\``;
        }

        /** Build the full prompt by combining user text + code context */
        function buildPrompt(userText, codeContext) {
            let prompt = '';

            if (codeContext) {
                const tab = fileTabs.find(t => t.id === activeTabId);
                const fileName = tab ? tab.name : 'untitled';

                if (codeContext.isFullFile) {
                    prompt += `**File: ${fileName}** (Full file, ${codeContext.code.split('\n').length} lines)\n`;
                    prompt += formatCodeForAI(codeContext.code, 1, fileName);
                } else {
                    prompt += `**File: ${fileName}** (Lines ${codeContext.startLine}–${codeContext.endLine} of ${els.codeEditor.value.split('\n').length})\n`;
                    prompt += formatCodeForAI(codeContext.text, codeContext.startLine, fileName);
                }

                prompt += '\n\n';
            }

            prompt += userText;
            return prompt;
        }

        // Stores code context to attach to the next message
        let pendingCodeContext = null;

        async function handleSendClick() {
            if (abortController) {
                abortController.abort();
                abortController = null;
                setLoading(false);
                appendBotMessage('<span style="color:var(--text-secondary)">Generation aborted.</span>');
                renderRetryButton();
            } else {
                sendMessage();
            }
