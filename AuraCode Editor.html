        async function sendMessage() {
            const userText = els.userInput.value.trim();
            if (!userText) return;

            // Check API key
            const selectedKeyType = els.keySel.value;
            const activeKey = selectedKeyType === 'key1' ? decryptedKeys.key1 : decryptedKeys.key2;
            if (!activeKey || activeKey.includes("YOUR_API") || !genAI) {
                appendUserMessage(userText);
                appendBotMessage(`<div class="error-message"><strong>Configuration Error</strong><br>Please configure and unlock your API Keys in Settings.</div>`);
                els.userInput.value = '';
                return;
            }

            // Build the prompt with optional code context
            const fullPrompt = buildPrompt(userText, pendingCodeContext);

            // Show the user message in chat
            const displayText = pendingCodeContext
                ? `${pendingCodeContext.isFullFile ? '📄 [Full File]' : `📤 [Lines ${pendingCodeContext.startLine}–${pendingCodeContext.endLine}]`}\n${userText}`
                : userText;
            appendUserMessage(displayText);
            renderRetryButton();

            chatHistory.push({ role: 'user', text: fullPrompt });

            // Store the code snapshot for edit application
            const codeSnapshotForEdits = els.codeEditor.value;

            els.userInput.value = '';
            els.userInput.style.height = 'auto';
            pendingCodeContext = null;
            setLoading(true);

            abortController = new AbortController();
            const signal = abortController.signal;

            const botMsgDiv = appendBotMessage('<div class="loading-indicator">Thinking...</div>');
            const botContentDiv = botMsgDiv.querySelector('.bot-content');

            let fullText = "";

            try {
                if (!chat) initChatInstance();

                const result = await chat.sendMessageStream([{ text: fullPrompt }], { signal });

                for await (const chunk of result.stream) {
                    const isAtBottom = (els.chatMsgs.scrollHeight - els.chatMsgs.scrollTop - els.chatMsgs.clientHeight) < 100;

                    const chunkText = chunk.text();
                    fullText += chunkText;

                    // Render markdown — but strip the json:edits blocks from display
                    const displayText = fullText.replace(/```json:edits\s*\n[\s\S]*?```/g,
                        '<div style="color: var(--active-color); font-size: 0.75rem; padding: 4px 0;">✏️ <em>Code edits detected (see below)</em></div>');
                    botContentDiv.innerHTML = DOMPurify.sanitize(marked.parse(displayText), domPurifyConfig);

                    if (isAtBottom) scrollBottom();
                }

                // Final response processing
                const response = await result.response;
                const citations = getCitations(response);

                // Parse edit blocks from the response
                const edits = parseEditsFromResponse(fullText);

                // Build final display HTML (strip json:edits blocks)
                const cleanText = fullText.replace(/```json:edits\s*\n[\s\S]*?```/g, '');
                let finalHtml = DOMPurify.sanitize(marked.parse(cleanText), domPurifyConfig);
                if (citations) finalHtml += citations;

                // If edits were detected, show diff preview + Approve/Reject buttons
                if (edits && edits.length > 0) {
                    const diffHtml = generateDiffPreview(edits, codeSnapshotForEdits);
                    finalHtml += diffHtml;

                    // Create a unique ID for this edit set
                    const editSetId = 'edits_' + crypto.randomUUID();

                    // Check if editor content has diverged since the snapshot was taken
                    const codeChanged = codeSnapshotForEdits !== els.codeEditor.value;

                    finalHtml += `<div class="edit-actions" id="${editSetId}">`;
                    if (codeChanged) {
                        finalHtml += `<div style="color:var(--warning-color); font-size: 0.75rem; margin-bottom: 6px;">⚠️ File was modified since this snapshot. Approve is disabled.</div>`;
                        finalHtml += `<button class="approve-edits-btn applied" data-edit-id="${editSetId}" disabled>✅ Approve Edits (${edits.length})</button>`;
                    } else {
                        finalHtml += `<button class="approve-edits-btn" data-edit-id="${editSetId}">✅ Approve Edits (${edits.length})</button>`;
                    }
                    finalHtml += `<button class="reject-edits-btn" data-edit-id="${editSetId}">✖ Dismiss</button>`;
                    finalHtml += `</div>`;

                    // Store edits for later application
                    pendingEditsMap.set(editSetId, {
                        edits: edits,
                        codeSnapshot: codeSnapshotForEdits
                    });
                }

                botContentDiv.innerHTML = finalHtml;
                botContentDiv.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
                addCodeBlockButtons(botContentDiv);

                // Attach approve/reject event listeners
                if (edits && edits.length > 0) {
                    botContentDiv.querySelectorAll('.approve-edits-btn').forEach(btn => {
                        btn.addEventListener('click', handleApproveEdits);
                    });
                    botContentDiv.querySelectorAll('.reject-edits-btn').forEach(btn => {
                        btn.addEventListener('click', handleRejectEdits);
                    });
                }

                chatHistory.push({ role: 'model', text: fullText, html: finalHtml, edits: edits });

            } catch (err) {
                if (err.name === 'AbortError') {
                    const abortedHtml = DOMPurify.sanitize(marked.parse(fullText), domPurifyConfig) +
                        '<br><span style="color:var(--text-secondary); font-style:italic;">(Generation stopped)</span>';
                    botContentDiv.innerHTML = abortedHtml;
                    if (fullText) {
                        chatHistory.push({ role: 'model', text: fullText, html: abortedHtml });
                    }
                } else {
                    if (!fullText) botMsgDiv.remove();
                    appendBotMessage(formatError(err));
                }
            } finally {
                abortController = null;
                setLoading(false);
                renderRetryButton();
                if ((els.chatMsgs.scrollHeight - els.chatMsgs.scrollTop - els.chatMsgs.clientHeight) < 100) {
                    scrollBottom();
                }
            }
        }

        // ============================================================= //
        //  APPROVE / REJECT EDITS HANDLERS                               //
        // ============================================================= //

        /**
         * Handle the "Approve Edits" button click.
         * Applies edits using the bottom-to-top algorithm.
         */
        function handleApproveEdits(e) {
            const editId = e.target.dataset.editId;
            const editData = pendingEditsMap.get(editId);

            if (!editData) {
                showToast('Edit data not found', 'error');
                return;
            }

            // Block if the file has diverged since the snapshot was taken
            if (editData.codeSnapshot !== els.codeEditor.value) {
                showToast('File has changed since this snapshot — edits cannot be applied.', 'error', 4000);
                e.target.textContent = '⚠️ Stale';
                e.target.classList.add('applied');
                e.target.disabled = true;
                return;
            }

            // Preserve cursor and scroll position before applying edits
            const savedCursorPos = els.codeEditor.selectionStart;
            const savedScrollTop = els.codeEditor.scrollTop;
            const oldLineCount = editData.codeSnapshot.split('\n').length;

            // Push the current content onto the undo stack
            pushUndo(activeTabId, editData.codeSnapshot, savedCursorPos);

            // Apply the edits using the bottom-to-top algorithm
            const newCode = applyEditsBottomToTop(editData.codeSnapshot, editData.edits);

            // Update the editor
            els.codeEditor.value = newCode;

            // Restore cursor — adjust for line delta
            const newLineCount = newCode.split('\n').length;
            const lineDelta = newLineCount - oldLineCount;
            const adjustedCursorPos = Math.min(
                Math.max(0, savedCursorPos + lineDelta),
                newCode.length
            );
            els.codeEditor.setSelectionRange(adjustedCursorPos, adjustedCursorPos);
            els.codeEditor.scrollTop = savedScrollTop;

            updateLineGutter();
            updateCursorInfo();

            // Update the active tab's content
            const tab = fileTabs.find(t => t.id === activeTabId);
            if (tab) {
                tab.content = newCode;
                tab.dirty = true;
            }
            scheduleAutoSave();

            // Mark button as applied
            e.target.textContent = '✅ Applied!';
            e.target.classList.add('applied');
            e.target.disabled = true;

            // Hide the reject button
            const actionsDiv = document.getElementById(editId);
            if (actionsDiv) {
                const rejectBtn = actionsDiv.querySelector('.reject-edits-btn');
                if (rejectBtn) rejectBtn.style.display = 'none';
            }

            // Clean up
            pendingEditsMap.delete(editId);

            showToast(`${editData.edits.length} edit(s) applied · Ctrl+Z to undo`);
            els.statusLeft.textContent = `${newCode.split('\n').length} lines · Edits applied`;
        }

        /** Handle the "Reject/Dismiss" button click */
        function handleRejectEdits(e) {
            const editId = e.target.dataset.editId;
            const actionsDiv = document.getElementById(editId);
            if (actionsDiv) {
                actionsDiv.innerHTML = '<span style="color: var(--text-secondary); font-size: 0.75rem; font-style: italic;">Edits dismissed</span>';
            }
            pendingEditsMap.delete(editId);
        }

        // ============================================================= //
        //  SEND CODE CONTEXT BUTTONS                                     //
        // ============================================================= //

        /** Send selected lines to the AI chat */
        function sendSelectedCode() {
            const selection = getSelectedLineRange();
            if (!selection) {
                showToast('Select some code first', 'error');
                return;
            }
            pendingCodeContext = {
                isFullFile: false,
                startLine: selection.startLine,
                endLine: selection.endLine,
                text: selection.text,
                code: els.codeEditor.value
            };
            els.userInput.focus();
            els.userInput.placeholder = `[Lines ${selection.startLine}–${selection.endLine} attached] Describe your changes...`;
            showToast(`Lines ${selection.startLine}–${selection.endLine} attached`);
        }

        /** Send the full file to the AI chat */
        function sendFullFile() {
            const code = els.codeEditor.value;
            if (!code.trim()) {
                showToast('Editor is empty', 'error');
                return;
            }
            pendingCodeContext = {
                isFullFile: true,
                code: code
            };
            els.userInput.focus();
            els.userInput.placeholder = `[Full file attached] Describe your changes...`;
            showToast('Full file attached');
        }

        // ============================================================= //
        //  CLEAR CHAT                                                    //
        // ============================================================= //
        function clearChat() {
            if (chatHistory.length === 0) return;
            if (!confirm("Clear all chat messages?")) return;
            chatHistory = [];
            els.chatMsgs.innerHTML = '';
            pendingEditsMap.clear();
            initChatInstance();
            showToast('Chat cleared');
        }

        // ============================================================= //
        //  MODAL EVENTS — Inherited from Codex                           //
        // ============================================================= //
        function setupModalEvents() {
            els.modalCloseBtn.onclick = () => {
                els.htmlPreviewModal.style.display = "none";
                els.previewIframe.srcdoc = '';
            };
            window.addEventListener('click', (e) => {
                if (e.target === els.htmlPreviewModal) {
                    els.htmlPreviewModal.style.display = "none";
                    els.previewIframe.srcdoc = '';
                }
            });
        }

        // ============================================================= //
        //  INITIALIZATION                                                //
        // ============================================================= //
        function init() {
            setupCryptoEvents();
            setupResizer();
            setupModalEvents();

            // Check for encrypted keys — show PIN modal if found
            const encryptedStr = localStorage.getItem(LS_KEYS.encryptedKeys);
            if (encryptedStr) {
                els.pinModal.style.display = 'flex';
                els.startupPin.focus();
            } else {
                continueInit();
            }
        }

        async function continueInit() {
            els.modeToggle.checked = localStorage.getItem(LS_KEYS.isGemma) === 'true';
            initGenAI();
            populateModels();
            updateModeUI();

            // Restore last model
            const lastModel = localStorage.getItem(LS_KEYS.model);
            if (lastModel) {
                els.modelSel.value = lastModel;
            }

            // Restore persisted session config
            if (sessionConfig.systemInstruction) {
                els.sysInstr.value = sessionConfig.systemInstruction;
            }
            if (sessionConfig.useGoogleSearch) els.googleSearchBtn.classList.add('active');
            if (sessionConfig.useCodeExecution) els.codeExecBtn.classList.add('active');
            if (sessionConfig.useUrlContext) els.urlToggleBtn.classList.add('active');

            initChatInstance();

            // Restore tabs from IndexedDB, or create a default tab
            const restored = await restoreTabs();
            if (!restored) {
                createTab('main.js', '// Welcome to AuraCode Editor\n// Start coding here or paste your code\n\nfunction hello() {\n    console.log("Hello, World!");\n}\n\nhello();\n');
            }

            updateThinkingButtonUI(sessionConfig.thinkingMode);
        }

        // ============================================================= //
        //  EVENT LISTENERS                                               //
        // ============================================================= //

        // --- Editor Events ---
        els.codeEditor.addEventListener('input', () => {
            updateLineGutter();
            updateCursorInfo();
            // Save to active tab and mark dirty
            const tab = fileTabs.find(t => t.id === activeTabId);
            if (tab) {
                tab.content = els.codeEditor.value;
                tab.dirty = true;
            }
            scheduleAutoSave();
        });

        els.codeEditor.addEventListener('scroll', syncGutterScroll);

        els.codeEditor.addEventListener('click', updateCursorInfo);
        els.codeEditor.addEventListener('keyup', updateCursorInfo);
        els.codeEditor.addEventListener('select', updateCursorInfo);

        // Tab key handling for indentation
        els.codeEditor.addEventListener('keydown', (e) => {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = els.codeEditor.selectionStart;
                const end = els.codeEditor.selectionEnd;

                if (e.shiftKey) {
                    // Shift+Tab: Unindent selected lines
                    const text = els.codeEditor.value;
                    const beforeCursor = text.substring(0, start);
                    const lineStart = beforeCursor.lastIndexOf('\n') + 1;
                    const lineText = text.substring(lineStart, end);
                    const lines = lineText.split('\n');
                    
                    let firstLineRemoved = 0;
                    if (lines.length > 0) {
                        if (lines[0].startsWith('    ')) firstLineRemoved = 4;
                        else if (lines[0].startsWith('\t')) firstLineRemoved = 1;
                    }
                    
                    const unindented = lines.map(l => l.startsWith('    ') ? l.slice(4) : (l.startsWith('\t') ? l.slice(1) : l));
                    const newText = text.substring(0, lineStart) + unindented.join('\n') + text.substring(end);
                    els.codeEditor.value = newText;
                    const diff = lineText.length - unindented.join('\n').length;
                    els.codeEditor.setSelectionRange(Math.max(lineStart, start - firstLineRemoved), end - diff);
                } else {
                    // Tab: Insert 4 spaces
                    els.codeEditor.value = els.codeEditor.value.substring(0, start) +
                        '    ' + els.codeEditor.value.substring(end);
                    els.codeEditor.selectionStart = els.codeEditor.selectionEnd = start + 4;
                }
                updateLineGutter();
                updateCursorInfo();
            }
        });

        els.addTabBtn.addEventListener('click', promptNewTab);
        els.sendSelBtn.addEventListener('click', sendSelectedCode);
        els.sendFullBtn.addEventListener('click', sendFullFile);

        function saveCurrentFile() {
            const tab = fileTabs.find(t => t.id === activeTabId);
            if (!tab) return;
            const blob = new Blob([tab.content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = tab.name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            // Defer revocation to ensure the download completes before the blob URL is freed
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            tab.dirty = false;
            renderTabs();
            scheduleAutoSave();
            showToast(`Saved ${tab.name}`);
        }
        
        els.openFileBtn.addEventListener('click', () => els.hiddenFileInput.click());
        els.saveFileBtn.addEventListener('click', saveCurrentFile);
        els.hiddenFileInput.addEventListener('change', (e) => {
            Array.from(e.target.files).forEach(file => {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    createTab(file.name, ev.target.result);
                    showToast(`Opened ${file.name}`);
                };
                reader.readAsText(file);
            });
            els.hiddenFileInput.value = '';
        });

        // Drag counter to fix premature dragleave when hovering over child elements
        let _dragCounter = 0;
        els.editorWorkspace.addEventListener('dragenter', (e) => {
            e.preventDefault();
            _dragCounter++;
            els.editorWorkspace.style.boxShadow = 'inset 0 0 0 2px var(--active-color)';
        });
        els.editorWorkspace.addEventListener('dragover', (e) => {
            e.preventDefault();
        });
        els.editorWorkspace.addEventListener('dragleave', (e) => {
            e.preventDefault();
            _dragCounter--;
            if (_dragCounter <= 0) {
                _dragCounter = 0;
                els.editorWorkspace.style.boxShadow = 'none';
            }
        });
        els.editorWorkspace.addEventListener('drop', (e) => {
            e.preventDefault();
            _dragCounter = 0;
            els.editorWorkspace.style.boxShadow = 'none';
            if (e.dataTransfer.files.length > 0) {
                Array.from(e.dataTransfer.files).forEach(file => {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        createTab(file.name, ev.target.result);
                        showToast(`Opened ${file.name}`);
                    };
                    reader.readAsText(file);
                });
            }
        });

        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
                e.preventDefault();
                saveCurrentFile();
            }
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'o') {
                e.preventDefault();
                els.hiddenFileInput.click();
            }
            // Ctrl+Z / Cmd+Z: Undo last applied edit set (only when NOT focused on textarea — textarea has native undo)
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !e.shiftKey) {
                // Only intercept if the editor textarea does not have focus (native undo handles that),
                // OR if we detect the undo stack has entries and the user is in the editor
                if (document.activeElement === els.codeEditor && undoStacks.has(activeTabId) && undoStacks.get(activeTabId).length > 0) {
                    e.preventDefault();
                    const snapshot = popUndo(activeTabId);
                    if (snapshot) {
                        els.codeEditor.value = snapshot.content;
                        const clampedPos = Math.min(snapshot.cursorPos, snapshot.content.length);
                        els.codeEditor.setSelectionRange(clampedPos, clampedPos);
                        updateLineGutter();
                        updateCursorInfo();
                        const tab = fileTabs.find(t => t.id === activeTabId);
                        if (tab) {
                            tab.content = snapshot.content;
                            tab.dirty = true;
                        }
                        scheduleAutoSave();
                        showToast('Edit set undone', 'warning');
                    }
                }
            }
        });

        // --- Chat Events ---
        els.userInput.addEventListener('input', () => {
            els.userInput.style.height = 'auto';
            els.userInput.style.height = els.userInput.scrollHeight + 'px';
            checkInputState();
        });

        els.userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey || !e.shiftKey)) {
                e.preventDefault();
                if (!els.sendBtn.disabled && !abortController) handleSendClick();
            }
        });

        // Reset placeholder when input is cleared
        els.userInput.addEventListener('blur', () => {
            if (!els.userInput.value.trim() && !pendingCodeContext) {
                els.userInput.placeholder = 'Describe the changes you want...';
            }
        });

        els.sendBtn.addEventListener('click', handleSendClick);
        els.clearChatBtn.addEventListener('click', clearChat);

        // --- Mode Toggle ---
        els.modeToggle.addEventListener('change', () => {
            updateModeUI();
            populateModels();
            updateSessionConfig();
        });

        // --- Settings ---
        els.settingsToggle.addEventListener('click', () => els.settingsPanel.classList.toggle('visible'));
        els.modelSel.addEventListener('change', updateSessionConfig);
        els.keySel.addEventListener('change', () => {
            initGenAI();
            initChatInstance();
        });
        els.sysInstr.addEventListener('change', updateSessionConfig);

        // --- Tool Toggles ---
        els.googleSearchBtn.addEventListener('click', () => {
            els.googleSearchBtn.classList.toggle('active');
            updateSessionConfig();
        });
        els.codeExecBtn.addEventListener('click', () => {
            els.codeExecBtn.classList.toggle('active');
            updateSessionConfig();
        });
        els.urlToggleBtn.addEventListener('click', () => {
            els.urlToggleBtn.classList.toggle('active');
            updateSessionConfig();
        });

        // --- Thinking Toggles ---
        els.thinkingLowBtn.addEventListener('click', () => handleThinkingToggle('low'));
        els.thinkingHighBtn.addEventListener('click', () => handleThinkingToggle('high'));

        // --- Resizer responsive fix: clear inline flex styles when crossing 900px ---
        window.addEventListener('resize', () => {
            const isMobile = window.innerWidth <= 900;
            // If we cross the breakpoint, reset inline styles so CSS flex rules take over
            if (isMobile || !isMobile) {
                els.editorPane.style.flex = '';
                els.chatPane.style.flex = '';
                // Clear persisted resizer when in mobile mode
                if (isMobile) {
                    localStorage.removeItem(LS_KEYS.resizerPercent);
                }
            }
        });

        // --- Guard against accidental data loss on page unload ---
        window.addEventListener('beforeunload', (e) => {
            const hasDirty = fileTabs.some(t => t.dirty);
            if (hasDirty) {
                e.preventDefault();
                e.returnValue = '';
            }
            // Best-effort synchronous persist
            persistTabs();
        });

        // ============================================================= //
        //  LAUNCH                                                        //
        // ============================================================= //
        init();

    </script>
</body>

</html>
